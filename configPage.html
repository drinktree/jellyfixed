<!DOCTYPE html>
<html lang="en">
<head>
    <title>Custom Theme</title>
</head>
<body>
    <div id="CustomThemeConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
         data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <!-- INSIDE the data-role="page" div on purpose. Jellyfin loads a plugin
             configuration page with `wrapper.innerHTML = html` and then keeps ONLY
             `wrapper.querySelector('div[data-role="page"]')` (components/viewContainer.js,
             identical in 10.11 and 12.0) — everything outside that element, <head> and
             all, is discarded. While this <style> lived in <head> the page rendered as
             unstyled markup on every version. Its var() fallbacks are load-bearing for
             the same reason the branding CSS never reaches here: the dashboard layout
             does not mount CustomCss at all, so --accent-red and --font-netflix never
             resolve on this page and the literals are what actually paint. -->
        <style>
        .ct-wrap { max-width: 760px; }
        .ct-intro { color: #888; margin-bottom: 20px; }
        /* Every var() carries a literal fallback, and on this page the FALLBACK is
           what paints: Jellyfin's dashboard layout does not mount the branding
           CustomCss at all, so --accent-red and --font-netflix never resolve here.
           The var() forms are kept so the page follows the admin's accent if that
           ever changes. */
        .ct-section { margin-bottom: 20px; padding: 16px 18px; background: rgba(255,255,255,0.03); border-radius: 6px; }
        .ct-section h3 { margin: 0 0 8px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: #999; }
        .ct-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0; min-height: 40px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .ct-row:last-child { border-bottom: none; }
        .ct-row label.ct-label { font-size: 0.95rem; }
        /* #333 + a 0.15 white hairline is the theme's one input treatment (login,
           settings drawer); #292929 with a solid #555 border was a fourth style. */
        .ct-row select, .ct-row input[type="text"] { background: #333; color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; padding: 7px 10px; font-size: 0.85rem; min-width: 180px; font-family: var(--font-netflix, inherit); }
        .ct-row input[type="color"] { width: 44px; height: 30px; border: 2px solid rgba(255,255,255,0.15); border-radius: 4px; cursor: pointer; padding: 0; background: none; }
        .ct-row input[type="checkbox"] { width: 22px; height: 22px; flex: 0 0 auto; cursor: pointer; accent-color: var(--accent-red, #E50914); }
        .ct-actions { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
        .ct-save { background: var(--accent-red, #E50914); color: #fff; border: none; padding: 12px 32px; border-radius: 4px; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: var(--font-netflix, inherit); }
        /* Netflix's red DARKENS on hover — lightening it is the tell this project's
           own source calls out, and the admin page was the last place still doing it. */
        .ct-save:hover { background: var(--accent-red-hover, #C11119); }
        .ct-reset { background: transparent; color: #aaa; border: 1px solid rgba(255,255,255,0.15); padding: 12px 24px; border-radius: 4px; font-size: 0.9rem; cursor: pointer; font-family: var(--font-netflix, inherit); }
        .ct-reset:hover { border-color: var(--accent-red, #E50914); color: #fff; }
        .ct-status { margin-top: 14px; padding: 10px 14px; border-radius: 4px; display: none; }
        .ct-status.success { display: block; background: rgba(70,211,105,0.15); color: #46d369; }
        .ct-status.error { display: block; background: rgba(229,9,20,0.15); color: #E50914; }
        /* The intro's file row: the path, a button that opens Jellyfin's own server
           file browser, and under it what the SERVER makes of the path. */
        .ct-path { display: flex; align-items: center; gap: 8px; flex: 0 1 460px; min-width: 0; }
        .ct-row .ct-path input[type="text"] { flex: 1 1 auto; min-width: 0; }
        .ct-browse { flex: none; background: transparent; color: #ddd; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; padding: 7px 12px; font-size: 0.85rem; cursor: pointer; font-family: var(--font-netflix, inherit); }
        .ct-browse:hover { border-color: rgba(255,255,255,0.4); color: #fff; }
        .ct-note { font-size: 0.85rem; line-height: 1.4; color: #999; padding: 8px 0 10px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .ct-note:empty { display: none; }
        .ct-note.ok { color: #46d369; }
        .ct-note.bad { color: #ff7a7a; }
        </style>
        <div data-role="content">
            <div class="content-primary ct-wrap">
                <h2>Custom Theme</h2>
                <p class="ct-intro">A Netflix-inspired skin for Jellyfin. Settings are stored on the server and apply to every device. After saving, reload the web page to see the new look.</p>

                <div id="ctSections"></div>

                <div class="ct-actions">
                    <button type="button" class="ct-save" id="ctSave">Save &amp; Apply</button>
                    <button type="button" class="ct-reset" id="ctReset">Reset to defaults</button>
                </div>
                <div class="ct-status" id="ctStatus"></div>
            </div>
        </div>

    <script type="text/javascript">
    (function () {
        var PLUGIN_ID = '78b7b285-8d9e-4e4c-8e4d-7a71f76d4e2a';

        var FONTS = [
            ['inter', 'Inter'], ['poppins', 'Poppins'], ['montserrat', 'Montserrat'],
            ['roboto', 'Roboto'], ['oswald', 'Oswald'], ['raleway', 'Raleway'],
            ['nunito', 'Nunito'], ['bebas', 'Bebas Neue'], ['lato', 'Lato'],
            ['sourcesans', 'Source Sans'], ['ubuntu', 'Ubuntu'], ['playfair', 'Playfair Display'],
            ['quicksand', 'Quicksand'], ['comfortaa', 'Comfortaa'], ['righteous', 'Righteous']
        ];

        // Single source of truth for every setting.
        var SECTIONS = [
            // `netflix` first: a stored value that matches no option leaves the first
            // one showing, and saving then writes it.
            ['Brand', [
                ['Brand', 'select', 'Theme (Villa Cocquette brings its own gold accent and logos)', [['netflix','Netflix'],['villa','Villa Cocquette']]]
            ]],
            ['Injection', [
                ['OwnInjection', 'toggle', 'Self-contained injection via built-in middleware (no File Transformation plugin needed)'],
                ['ProvideFileTransformation', 'toggle', 'Provide File Transformation to other plugins (e.g. Media Bar) so they work without the separate plugin']
            ]],
            ['Features', [
                ['CleanHome', 'toggle', 'Clean Netflix home (hide native rows, plugin owns the home page)'],
                ['HeroBillboard', 'toggle', 'Hero carousel on the home page'],
                ['GenreRows', 'toggle', 'Genre rows on the home page'],
                ['GenreRowsExclude', 'text', 'Genres never shown as home rows (comma-separated)'],
                ['MyListRow', 'toggle', '"My List" row (your favorites)'],
                ['BecauseYouWatched', 'toggle', '"Because you watched X" recommendation rows'],
                ['NewReleasesRow', 'toggle', '"New Releases" row (recently added, with NEW flag)'],
                ['WatchAgainRow', 'toggle', '"Watch It Again" row (finished titles)'],
                ['RatingPlate', 'toggle', 'Maturity-rating plate at playback start'],
                ['AmbientColor', 'toggle', 'Ambient colour glow sampled from the hero / detail artwork'],
                ['FilmGrain', 'toggle', 'Subtle film-grain texture (adds depth; off on TV)'],
                ['NavTabs', 'toggle', 'Top navigation tabs'],
                ['HoverPreviewCard', 'toggle', 'Hover expand card (grows + info panel with buttons)'],
                ['PreviewClips', 'toggle', 'Autoplay preview clip on hover (streams ~30s from the middle, nothing stored)'],
                ['TopTenRow', 'toggle', 'Top 10 rank numbers on the first content row'],
                ['MatchScore', 'toggle', 'Show rating as green "x% Match" (Netflix style)'],
                ['GlassEffect', 'toggle', 'Frosted-glass blur (header, dialogs, drawer)'],
                ['OledBlack', 'toggle', 'OLED pure-black background']
            ]],
            ['Colors', [
                ['SeasonalTheme', 'select', 'Color preset', [['default','Default'],['monochrome','Monochrome'],['colorful','Colorful'],['christmas','Christmas'],['halloween','Halloween'],['summer','Summer'],['ocean','Ocean']]],
                ['AccentColor', 'color', 'Accent color'],
                ['BgColor', 'color', 'Background'],
                ['TextColor', 'color', 'Text color'],
                ['MutedColor', 'color', 'Muted text'],
                ['ProgressColor', 'select', 'Progress bar', [['accent','Accent'],['red','Red'],['green','Green'],['blue','Blue'],['purple','Purple']]]
            ]],
            ['Intro', [
                ['IdentEnabled', 'toggle', 'Play an intro before films. The theme plays the video itself: full screen, with sound, no player controls, and the film follows'],
                ['IdentPath', 'text', 'Intro video file on the server (an MP4 with H.264 video and AAC sound plays everywhere)'],
                ['IdentEpisodes', 'toggle', 'Also before an episode started on its own — from its page, a card or Next Up (never between auto-playing episodes)'],
                ['IdentSkippable', 'toggle', 'Skippable with Esc, Enter, Space, a click, or OK on a remote (Back always leaves without starting the film)'],
                ['IdentApple', 'toggle', 'Also on iPhone, iPad and Safari (experimental: try it on your device before relying on it)'],
                ['IdentApps', 'toggle', 'Also in apps that do not show the theme — Android TV, Roku, Kodi … They play it with their own player and controls, when their own "Cinema mode" setting is on (the Android TV app: before films only)']
            ]],
            ['Requests', [
                ['SeerrRequests', 'toggle', 'Requests in the app (Seerr, through the Jellyseerr Bridge plugin): a Requests page in the navigation, results on the search page, a request window']
            ]],
            ['Logo & Header', [
                ['LogoStyle', 'select', 'Logo style', [['jellyfin','Jellyfin'],['netflix','Netflix N'],['letter','Letter'],['custom','Custom image'],['none','None']]],
                ['LogoLetter', 'select', 'Logo letter', 'AZ'],
                ['CustomLogoUrl', 'text', 'Logo image URL'],
                ['NavLeft', 'toggle', 'Left-aligned navigation (Netflix style)'],
                ['HeaderBlur', 'toggle', 'Header blur effect']
            ]],
            ['Elements', [
                ['ShowBadges', 'toggle', 'Unplayed count badges'],
                ['ShowPlayed', 'toggle', 'Watched checkmarks'],
                ['ShowBackdrop', 'toggle', 'Backdrop image'],
                ['RoundCast', 'toggle', 'Round cast images'],
                ['ShowDescription', 'toggle', 'Description'],
                ['ShowTags', 'toggle', 'Tags'],
                ['ShowExternalLinks', 'toggle', 'External links (IMDb, TMDB)'],
                ['ShowSimilar', 'toggle', 'Similar titles'],
                ['SpoilerMode', 'toggle', 'Spoiler mode (blur unwatched)']
            ]],
            ['Detail Page Buttons', [
                ['ShowBtnWatched', 'toggle', 'Watched button'],
                ['ShowBtnFavorite', 'toggle', 'Favorite button'],
                ['ShowBtnMore', 'toggle', 'More button']
            ]],
            ['Layout', [
                ['FontFamily', 'select', 'Font', FONTS],
                ['FontSize', 'select', 'Font size', [['small','Small'],['normal','Normal'],['large','Large']]],
                ['CardRadius', 'select', 'Card rounding', [['0','Square'],['4','Light'],['8','Medium'],['16','Round']]],
                ['CardSize', 'select', 'Card size', [['small','Small'],['normal','Normal'],['large','Large']]],
                ['CardStyle', 'select', 'Card shape', [['mixed','Mixed'],['portrait','Portrait'],['landscape','Landscape']]],
                ['CardHoverScale', 'toggle', 'Card hover zoom'],
                ['CardInfoOverlay', 'toggle', 'Card info overlay'],
                ['GradientStrength', 'select', 'Backdrop gradient', [['light','Light'],['medium','Medium'],['heavy','Heavy']]],
                ['TitleSize', 'select', 'Detail title size', [['small','Small'],['large','Large'],['huge','Huge']]],
                ['AnimSpeed', 'select', 'Animation speed', [['fast','Fast'],['normal','Normal'],['slow','Slow'],['off','Off']]],
                ['SidebarCompact', 'toggle', 'Compact sidebar'],
                ['AmbientGlow', 'toggle', 'Ambient glow']
            ]]
        ];

        var INT_KEYS = { CardRadius: true };

        function fields() {
            var out = [];
            SECTIONS.forEach(function (s) { s[1].forEach(function (f) { out.push(f); }); });
            return out;
        }

        function optionsFor(f) {
            var opts = f[3];
            if (opts === 'AZ') {
                opts = [];
                for (var i = 65; i <= 90; i++) { var c = String.fromCharCode(i); opts.push([c, c]); }
            }
            return opts || [];
        }

        function render() {
            var html = '';
            SECTIONS.forEach(function (section) {
                html += '<div class="ct-section"><h3>' + section[0] + '</h3>';
                section[1].forEach(function (f) {
                    var key = f[0], type = f[1], label = f[2];
                    html += '<div class="ct-row" data-field="' + key + '"><label class="ct-label" for="ct' + key + '">' + label + '</label>';
                    if (type === 'toggle') {
                        html += '<input type="checkbox" id="ct' + key + '">';
                    } else if (type === 'color') {
                        html += '<input type="color" id="ct' + key + '">';
                    } else if (key === 'IdentPath') {
                        html += '<span class="ct-path"><input type="text" id="ctIdentPath" placeholder="e.g. /media/intro.mp4" spellcheck="false" autocomplete="off">'
                            + '<button type="button" class="ct-browse" id="ctIdentBrowse">Browse…</button></span>';
                    } else if (type === 'text') {
                        html += '<input type="text" id="ct' + key + '"' + (key === 'CustomLogoUrl' ? ' placeholder="https://..."' : '') + '>';
                    } else {
                        html += '<select id="ct' + key + '">';
                        optionsFor(f).forEach(function (o) { html += '<option value="' + o[0] + '">' + o[1] + '</option>'; });
                        html += '</select>';
                    }
                    html += '</div>';
                    if (key === 'IdentPath') html += '<div class="ct-note" id="ctIdentNote" role="status"></div>';
                    if (key === 'SeerrRequests') html += '<div class="ct-note" id="ctSeerrNote" role="status"></div>';
                });
                html += '</div>';
            });
            document.getElementById('ctSections').innerHTML = html;
            document.getElementById('ctLogoStyle').addEventListener('change', updateVisibility);
            document.getElementById('ctBrand').addEventListener('change', updateVisibility);
            document.getElementById('ctIdentPath').addEventListener('change', checkIdent);
            document.getElementById('ctIdentEnabled').addEventListener('change', checkIdent);
            document.getElementById('ctSeerrRequests').addEventListener('change', checkSeerr);
            setupIdentBrowse();
        }

        // What the SERVER makes of the intro path: the one setting here that can be
        // wrong without anything looking wrong (a path as the Mac sees it, a folder,
        // a file the server's account may not read). Asked of the plugin itself.
        var IDENT_REASONS = {
            missing: 'The server cannot find a file at this path. Use the path as the server sees it — with Docker, the path inside the container.',
            folder: 'That is a folder. Choose the video file itself.',
            type: 'Not a video the theme can play. Use an .mp4, .m4v or .webm file.',
            empty: 'The file is empty.',
            large: 'The file is larger than 300 MB.',
            unreadable: 'The server is not allowed to read this file, or to open its folder.',
            slow: 'The disk did not answer in time.'
        };
        var identAsk = 0;
        var identSlow = 0;
        // The last answer the server gave, and the exact text it was about: Browse
        // only opens on a folder the server has confirmed.
        var identSeen = null;
        function identNote(text, cls) {
            var note = document.getElementById('ctIdentNote');
            note.className = 'ct-note' + (cls ? ' ' + cls : '');
            note.textContent = text;
        }
        function identSize(bytes) {
            if (!(bytes > 0)) return '';
            return bytes < 1048576 ? Math.max(1, Math.round(bytes / 1024)) + ' KB' : (bytes / 1048576).toFixed(1) + ' MB';
        }
        function checkIdent(again) {
            if (again !== true) identSlow = 0;
            var path = document.getElementById('ctIdentPath').value.trim();
            var on = document.getElementById('ctIdentEnabled').checked;
            var ask = ++identAsk;
            // What is known about exactly this text stays known while it is asked
            // again (leaving the field for the Browse button asks again).
            if (identSeen && identSeen.path !== path) identSeen = null;
            if (!path) {
                identNote(on ? 'Choose the video file on the server to play before films.' : '', on ? 'bad' : '');
                return;
            }
            if (typeof ApiClient === 'undefined' || !ApiClient.getJSON) return;
            ApiClient.getJSON(ApiClient.getUrl('CustomTheme/Ident/Check', { path: path })).then(function (r) {
                if (ask !== identAsk) return;
                r = r || {};
                var ok = r.Ok !== undefined ? r.Ok : r.ok;
                var reason = r.Reason || r.reason || '';
                var bytes = r.Bytes !== undefined ? r.Bytes : r.bytes;
                identSeen = { path: path, ok: !!ok, reason: reason };
                // A disk that was asleep: this very question woke it, and the server
                // has the answer a moment later. Ask again rather than leave a file
                // that is fine marked as broken.
                if (!ok && reason === 'slow' && identSlow < 3) {
                    identSlow++;
                    identNote('The disk is slow to answer. Asking again…', '');
                    setTimeout(function () { if (ask === identAsk) checkIdent(true); }, 2500);
                    return;
                }
                identSlow = 0;
                if (ok) {
                    // Above 64 MB the page does not hold the file whole (headerButton.js,
                    // NF_IDENT_HOLD_MAX): it is streamed when Play is pressed.
                    // Apps without the theme are given a copy made for them (IdentCopy.cs);
                    // the server says where it stands for the SAVED file only.
                    var apps = r.Apps || r.apps || '';
                    var appsBytes = r.AppsBytes !== undefined ? r.AppsBytes : r.appsBytes;
                    identNote('✓ The server can read this file' + (identSize(bytes) ? ' (' + identSize(bytes) + ')' : '') + '.'
                        + (bytes > 64 * 1024 * 1024 ? ' A file this large is streamed rather than kept in memory, so it may start a moment later.' : '')
                        + (apps === 'ready' ? ' Apps without the theme get a light copy of it' + (identSize(appsBytes) ? ' (' + identSize(appsBytes) + ')' : '') + ', which starts quickly on a television.'
                            : apps === 'making' ? ' A light copy for apps without the theme is being made; until it is ready they start films without the intro.'
                            : apps === 'failed' ? ' No copy for apps without the theme could be made (the server log says why); they get the file itself.'
                            : '')
                        + (on ? '' : ' Switch the intro on above to use it.'), 'ok');
                } else {
                    identNote('✗ ' + (IDENT_REASONS[reason] || 'The server cannot use this file.'), 'bad');
                }
            }, function () {
                if (ask === identAsk) identNote('The server did not answer the check for this path. Save, reload this page and look again.', '');
            });
        }
        // Jellyfin's own picker for files ON THE SERVER (the one library folders are
        // chosen with), so the path never has to be typed.
        function setupIdentBrowse() {
            var btn = document.getElementById('ctIdentBrowse');
            if (!window.Dashboard || !Dashboard.DirectoryBrowser) { btn.style.display = 'none'; return; }
            btn.addEventListener('click', function () {
                var input = document.getElementById('ctIdentPath');
                var cur = input.value.trim();
                var opts = {
                    includeFiles: true,
                    header: 'Intro video',
                    callback: function (path) {
                        if (path) { input.value = path; checkIdent(); }
                        picker.close();
                    }
                };
                // Open on the folder of the file already chosen — but only on one the
                // server has just confirmed for exactly this text. Handed a folder
                // that is not there (a path as the Mac sees it, typed a second ago),
                // Jellyfin's picker opens EMPTY, with not even the drives to start
                // from; without a path it opens on them.
                var seen = identSeen && identSeen.path === cur ? identSeen : null;
                if (seen && seen.reason === 'folder') {
                    opts.path = cur;
                } else if (seen && (seen.ok || seen.reason === 'type' || seen.reason === 'empty' || seen.reason === 'large')) {
                    var cut = Math.max(cur.lastIndexOf('/'), cur.lastIndexOf('\\'));
                    var dir = cut > 0 ? cur.slice(0, cut) : (cut === 0 ? '/' : '');
                    // A file in a Windows drive's root: "C:" alone is not the root.
                    if (/^[A-Za-z]:$/.test(dir)) dir += '\\';
                    if (dir) opts.path = dir;
                }
                var picker = new Dashboard.DirectoryBrowser();
                picker.show(opts);
            });
        }

        // Requests come through a second plugin, the Jellyseerr Bridge, and the part of
        // them that can be wrong is set up there — so this line says where the bridge
        // stands: installed and loaded, given a Seerr to talk to, taking requests from this
        // administrator, and getting answers from that Seerr. The settings drawer says the
        // same (headerButton.js, nfRqSetupLine), but this page cannot reach the theme's
        // script, so it carries its own copy of the steps and the words: keep the two alike.
        var SEERR_BRIDGE_ID = 'd2fcf9c8c3c747e89dd68de9867e36bb';
        // An update or a disable lists the bridge once per version until the next restart;
        // the entry that counts is the best of them. Deleted (uninstalled) and Superseded
        // (an older version) are on their way out and do not count.
        var SEERR_RANK = { Active: 5, Restart: 4, Disabled: 3 };
        var seerrAsk = 0;
        function seerrNote(line) {
            var note = document.getElementById('ctSeerrNote');
            note.className = 'ct-note' + (line[1] ? ' ' + line[1] : '');
            note.textContent = line[0];
        }
        // The theme script's permission probe (nfRqProbe), copied: a request the bridge
        // refuses before anything could reach Seerr. A 403 whose words say "disabled" is
        // the bridge's own switch ('off'); any other 403 refuses this user ('no'); any
        // other answer, such as the 400 its made-up type earns, is a yes ('ok').
        function seerrProbe() {
            try {
                return ApiClient.ajax({
                    type: 'POST', url: ApiClient.getUrl('JellyseerrBridge/Request'),
                    data: JSON.stringify({ mediaType: 'probe', mediaId: 0 }),
                    contentType: 'application/json', dataType: 'json'
                }).then(function () { return 'ok'; }, function (r) {
                    if (!r || r.status !== 403) return 'ok';
                    var read = typeof r.text === 'function' ? r.text() : Promise.resolve('');
                    return read.then(function (t) {
                        var words = String(t || '');
                        try {
                            var j = JSON.parse(words);
                            if (j && typeof j === 'object') words = String(j.message || j.error || j.title || '');
                        } catch (e) {}
                        return /disabled/i.test(words) ? 'off' : 'no';
                    }, function () { return 'no'; });
                });
            } catch (e) { return Promise.resolve('ok'); }
        }
        // [text, class] for where the bridge stands. Rejects only when the server does not
        // answer (the probe never rejects).
        function seerrLine() {
            return ApiClient.getInstalledPlugins().then(function (list) {
                var best = null;
                (list || []).forEach(function (p) {
                    if (!p || String(p.Id || '').replace(/-/g, '').toLowerCase() !== SEERR_BRIDGE_ID) return;
                    if (p.Status === 'Deleted' || p.Status === 'Superseded' || p.Status === 'Superceded') return;
                    if (!best || (SEERR_RANK[p.Status] || 0) > (SEERR_RANK[best.Status] || 0)) best = p;
                });
                if (!best) return ['The Jellyseerr Bridge plugin is not installed. Add its repository (https://raw.githubusercontent.com/monjaka/jellyfin-plugin-jellyseerr-bridge/main/manifest.json) in Dashboard → Plugins, install it, restart Jellyfin. Its web-loader script is not needed.', ''];
                if (best.Status === 'Restart') return ['Restart Jellyfin to load the Jellyseerr Bridge.', ''];
                if (best.Status === 'Disabled') return ['The Jellyseerr Bridge is disabled in Dashboard → Plugins.', ''];
                if (best.Status !== 'Active') return ['The Jellyseerr Bridge could not be loaded (see the server log).', ''];
                return ApiClient.getJSON(ApiClient.getUrl('JellyseerrBridge/Status')).then(function (s) {
                    if (!s || s.isConfigured !== true) return ['✗ Enter the Seerr address and API key in the Jellyseerr Bridge settings.', 'bad'];
                    var host = typeof s.jellyseerrHost === 'string' && s.jellyseerrHost ? s.jellyseerrHost : 'Seerr';
                    return seerrProbe().then(function (v) {
                        if (v === 'no') return ['✗ Your own account is not on the bridge\'s allowed list. If you listed users there, use the IDs without dashes.', 'bad'];
                        return seerrAnswers().then(function (yes) {
                            if (!yes) return ['✗ Seerr at ' + host + ' did not answer through the bridge. Check that Seerr is running and that the bridge\'s Seerr address and API key are right.', 'bad'];
                            if (v === 'off') return ['Connected to ' + host + '. Requests are switched off in the bridge; searching still works.', ''];
                            return ['✓ Connected to ' + host + '. Requests go to Seerr as its administrator and are approved at once. Titles and summaries come in Seerr\'s display language.', 'ok'];
                        });
                    });
                });
            });
        }
        // Whether Seerr itself answers through the bridge (the theme script's nfRqSeerrAnswers,
        // copied): neither the Status nor the probe ever reaches Seerr, so without this the line
        // said ✓ with Seerr down or a wrong API key in the bridge. One Discover call, the trending
        // list's first page: a 2xx with a results array is a yes; an error status, a body without
        // results, or no answer within 15 s (the bridge waits up to 30 s for Seerr) is a no.
        // Never rejects.
        function seerrAnswers() {
            return new Promise(function (resolve) {
                var timer = setTimeout(function () { resolve(false); }, 15000);
                var done = function (yes) { clearTimeout(timer); resolve(yes); };
                try {
                    ApiClient.getJSON(ApiClient.getUrl('JellyseerrBridge/Discover/trending', { page: 1 })).then(function (d) {
                        done(!!d && typeof d === 'object' && Array.isArray(d.results));
                    }, function () { done(false); });
                } catch (e) { done(false); }
            });
        }
        // Switched off, there is nothing to report and nothing is asked. The counter keeps
        // a slow answer to an earlier ask from writing over a newer one.
        function checkSeerr() {
            var ask = ++seerrAsk;
            if (!document.getElementById('ctSeerrRequests').checked) { seerrNote(['', '']); return; }
            if (typeof ApiClient === 'undefined' || !ApiClient.getInstalledPlugins) return;
            seerrLine().then(function (line) {
                if (ask === seerrAsk) seerrNote(line);
            }, function () {
                if (ask === seerrAsk) seerrNote(['The server did not answer this check. Reload this page and look again.', '']);
            });
        }

        function apply(config) {
            fields().forEach(function (f) {
                var key = f[0], type = f[1];
                var el = document.getElementById('ct' + key);
                if (!el) return;
                if (type === 'toggle') {
                    el.checked = config[key] !== false;
                } else if (config[key] !== undefined && config[key] !== null) {
                    el.value = String(config[key]);
                }
            });
            updateVisibility();
            checkIdent();
            checkSeerr();
        }

        function collect(config) {
            fields().forEach(function (f) {
                var key = f[0], type = f[1];
                var el = document.getElementById('ct' + key);
                if (!el) return;
                if (type === 'toggle') config[key] = el.checked;
                else if (INT_KEYS[key]) config[key] = parseInt(el.value, 10);
                else config[key] = el.value;
            });
            return config;
        }

        function updateVisibility() {
            // The Villa theme brings its own accent and its own marks, so the accent
            // well and the three logo rows do not apply while it is selected. Hidden
            // only: their values are still collected, and come back with Netflix.
            var villa = document.getElementById('ctBrand').value === 'villa';
            var logo = document.getElementById('ctLogoStyle').value;
            document.querySelector('[data-field="AccentColor"]').style.display = villa ? 'none' : '';
            document.querySelector('[data-field="LogoStyle"]').style.display = villa ? 'none' : '';
            document.querySelector('[data-field="LogoLetter"]').style.display = !villa && logo === 'letter' ? '' : 'none';
            document.querySelector('[data-field="CustomLogoUrl"]').style.display = !villa && logo === 'custom' ? '' : 'none';
        }

        function status(msg, ok) {
            var s = document.getElementById('ctStatus');
            // Clear any inline display:none from a previous auto-hide, otherwise the
            // message never shows again after the first successful save.
            s.style.display = '';
            s.className = 'ct-status ' + (ok ? 'success' : 'error');
            s.textContent = msg;
            clearTimeout(status._t);
            if (ok) status._t = setTimeout(function () { s.className = 'ct-status'; }, 5000);
        }

        function load() {
            if (typeof ApiClient === 'undefined' || !ApiClient.getPluginConfiguration) {
                setTimeout(load, 200);
                return;
            }
            ApiClient.getPluginConfiguration(PLUGIN_ID).then(apply);
        }

        // Jellyfin 12.0 persists its react-query cache to IndexedDB (idb-keyval:
        // database "keyval-store", store "keyval", key "jellyfin-query-cache") with a
        // 24-hour gcTime and a 60-second staleTime. The BrandingOptions response is in
        // there, and that response carries the plugin's entire generated stylesheet —
        // so without this, saving here and going back to the app re-renders the OLD
        // theme from the snapshot and the save looks like it did nothing. The cache
        // buster is the web client build id, which a plugin update never changes.
        //
        // Only ever opens a database it has first confirmed exists: opening one that
        // does not would create it, and rolling that back by aborting the
        // versionchange transaction risks leaving "keyval-store" at version 1 with no
        // object stores, which would permanently break jellyfin-web's own persister.
        // Where indexedDB.databases() is unavailable this does nothing. No-op on
        // 10.11, which has no such database. Always calls back.
        function evictQueryCache(done) {
            var finished = false;
            function finish() { if (finished) return; finished = true; done(); }
            setTimeout(finish, 1500);
            try {
                if (!window.indexedDB || !indexedDB.databases) { finish(); return; }
                indexedDB.databases().then(function (list) {
                    var exists = false;
                    for (var i = 0; i < (list || []).length; i++) {
                        if (list[i] && list[i].name === 'keyval-store') { exists = true; }
                    }
                    if (!exists) { finish(); return; }

                    var req = indexedDB.open('keyval-store');
                    req.onerror = finish;
                    req.onblocked = finish;
                    req.onupgradeneeded = finish;
                    req.onsuccess = function () {
                        var db = req.result;
                        try {
                            if (!db.objectStoreNames.contains('keyval')) { db.close(); finish(); return; }
                            var tx = db.transaction('keyval', 'readwrite');
                            tx.objectStore('keyval')['delete']('jellyfin-query-cache');
                            tx.oncomplete = function () { db.close(); finish(); };
                            tx.onerror = function () { db.close(); finish(); };
                            tx.onabort = function () { db.close(); finish(); };
                        } catch (e) { try { db.close(); } catch (e2) {} finish(); }
                    };
                })['catch'](finish);
            } catch (e) { finish(); }
        }

        function save() {
            ApiClient.getPluginConfiguration(PLUGIN_ID).then(function (config) {
                ApiClient.updatePluginConfiguration(PLUGIN_ID, collect(config)).then(function (result) {
                    if (window.Dashboard && Dashboard.processPluginConfigurationUpdateResult) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    }
                    evictQueryCache(function () {
                        status('Saved and applied. Reload the page to see the new theme.', true);
                    });
                }).catch(function (err) { status('Error: ' + err, false); });
            });
        }

        function reset() {
            if (!window.confirm('Reset all theme settings to their defaults?')) return;
            ApiClient.getPluginConfiguration(PLUGIN_ID).then(function (config) {
                Object.keys(config).forEach(function (k) {
                    if (k !== 'EnableInMainMenu') delete config[k];
                });
                ApiClient.updatePluginConfiguration(PLUGIN_ID, config).then(function () {
                    load();
                    evictQueryCache(function () {
                        status('Reset to defaults. Reload the page to see changes.', true);
                    });
                }).catch(function (err) { status('Error: ' + err, false); });
            });
        }

        render();
        document.getElementById('ctSave').addEventListener('click', save);
        document.getElementById('ctReset').addEventListener('click', reset);
        // Scoped to OUR page element: jellyfin keeps previously visited plugin pages
        // in the view container, so a document-wide .pluginConfigurationPage query can
        // bind this handler to a different plugin's cached page.
        document.getElementById('CustomThemeConfigPage').addEventListener('pageshow', load);
        load();
    })();
    </script>
    </div>
</body>
</html>
